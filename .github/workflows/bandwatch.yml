name: Bandwatch archiver

# The daily cron is OFF as of 2026-07-29. The archive now runs locally via
# launchd (com.bandwatch.archive, see agent.py): the CI runs hit two walls
# in one week, the 40-minute job timeout on heavy days (Jul 23, Jul 25) and
# GitHub's 100 MB per-file block once the monthly aggregate crossed ~89 MB
# (Jul 27-29: archiver step green, push step dead, three days lost). The
# storage is per-day files now so pushes fit again, but the local runner
# has no wall clock cap and its cadence is observable from the machine that
# owns the data. This workflow stays for manual dispatch as a backup path.
on:
  workflow_dispatch: {}   # manual "Run workflow" button only

permissions:
  contents: write   # the run commits new parquet/meta files back

concurrency:
  group: bandwatch-archive   # never let two archive runs race on the same files
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # Kalshi's public trade firehose runs at several million trades a day
    # platform-wide (see archiver.py's page-budget comments), so a run can
    # take a while, especially while the backfill pointer is still working
    # through older history. 40 was not generous enough: it killed the
    # Jul 23 and Jul 25 2026 runs mid-archive.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run archiver
        run: python archiver.py

      - name: Commit archived trades and metadata back to the repo
        run: |
          git config user.name "bandwatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing new this run"
            exit 0
          fi
          git commit -m "bandwatch: archive $(date -u +'%Y-%m-%d %H:%M UTC')"
          # another run may have pushed while this one archived; rebase then push
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
